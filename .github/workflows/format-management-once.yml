name: Format phone habit management once
on:
  push:
    branches: [feat/mobile-habit-management-local]
    paths: [.github/workflows/format-management-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx prettier --write src/App.tsx src/habit-prefs.ts src/habit-prefs.test.ts src/styles.css
      - name: Commit formatted files and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/habit-prefs.ts src/habit-prefs.test.ts src/styles.css
          git rm .github/workflows/format-management-once.yml
          git commit -m "style: format mobile management with repository Prettier"
          git push origin HEAD:feat/mobile-habit-management-local
