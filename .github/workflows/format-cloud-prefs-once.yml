name: Format cloud preference proposal once
on:
  push:
    branches: [feat/mobile-cloud-prefs-proposal]
    paths: [.github/workflows/format-cloud-prefs-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx prettier --write src/App.tsx src/domain.ts
      - name: Commit formatted files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/domain.ts
          git rm .github/workflows/format-cloud-prefs-once.yml
          git commit -m "style: format cloud preference proposal"
          git push origin HEAD:feat/mobile-cloud-prefs-proposal
