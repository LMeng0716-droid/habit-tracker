name: 手机端独立预览构建（不部署）
on:
  push:
    branches: [feat/mobile-cloud-tracker, fix/mobile-restore-archived, fix/mobile-checkin-streak-display, feat/mobile-habit-management-local]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 校验并构建独立预览（真实公开配置）
        run: npm run build:preview
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-preview-${{ github.sha }}
          path: dist-preview/
          if-no-files-found: error
          retention-days: 7
