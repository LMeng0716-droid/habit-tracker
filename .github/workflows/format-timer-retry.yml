name: One-time format timer retry
on:
  push:
    branches: [feat/numeric-midnight-split]
    paths:
      - .github/workflows/format-timer-retry.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/numeric-midnight-split
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/numeric.ts src/numeric.test.ts src/NumericHabits.tsx tests/numeric.spec.ts
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/numeric.ts src/numeric.test.ts src/NumericHabits.tsx tests/numeric.spec.ts
            git commit -m "style: format durable timer retry flow"
            git push origin HEAD:feat/numeric-midnight-split
          fi
