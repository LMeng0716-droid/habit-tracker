name: Format mobile fast management once
on:
  push:
    branches: [feat/mobile-fast-checkin-manage]
    paths: [.github/workflows/format-fast-manage-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx prettier --write src/App.tsx src/styles.css
      - name: Commit formatted files and delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git rm .github/workflows/format-fast-manage-once.yml
          git commit -m "style: format mobile management and check-in UI"
          git push origin HEAD:feat/mobile-fast-checkin-manage
