name: 数据库同步 API 检查
on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/sync-api.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/sync-api.yml'
permissions:
  contents: read
jobs:
  mobile-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 两表云端 RLS、事务和并发测试
        run: bash supabase/tests/run-mobile.sh
