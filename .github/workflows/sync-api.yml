name: 数据库同步 API 检查
on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/sync-api.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/sync-api.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 隔离 PostgreSQL 权限、事务与并发测试
        run: bash supabase/tests/run-local.sh
