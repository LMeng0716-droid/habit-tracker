name: Format numeric mobile layout once
on:
  push:
    branches:
      - feat/numeric-midnight-split
    paths:
      - .github/workflows/format-numeric-layout-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/numeric-midnight-split
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/NumericHabits.tsx src/App.tsx src/styles.css tests/numeric.spec.ts
      - name: Commit format changes
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/NumericHabits.tsx src/App.tsx src/styles.css tests/numeric.spec.ts
            git commit -m "style: format compact numeric mobile layout"
            git push origin HEAD:feat/numeric-midnight-split
          fi
