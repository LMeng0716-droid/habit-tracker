name: Format final Today editor test once
on:
  push:
    branches: [fix/mobile-today-drag-editor-simple]
    paths: [.github/workflows/format-today-tests-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx prettier --write src/App.tsx tests/app.spec.ts
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx tests/app.spec.ts
          git rm .github/workflows/format-today-tests-once.yml
          git commit -m "style: format final Today editor regression tests"
          git push origin HEAD:fix/mobile-today-drag-editor-simple
